name: Cleanup Debian Backports
on:
  workflow_dispatch:
    inputs:
      keep-count:
        description: 'Number of .deb versions to keep per package (the highest ones win, the rest are removed). 1 = only latest.'
        required: false
        default: '2'
      dry-run:
        description: 'If true, only print what would be removed without touching the repo.'
        required: false
        default: 'true'
      packages:
        description: 'Comma-separated package names to restrict cleanup to (empty = all packages that do NOT ship a ~devuandepot suffix).'
        required: false
        default: ''

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev python3 git

      - name: Identify candidates for removal
        env:
          KEEP_COUNT: ${{ inputs.keep-count }}
          PACKAGES: ${{ inputs.packages }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -eu
          python3 - <<'PYEOF'
          import os, subprocess
          from functools import cmp_to_key
          from collections import defaultdict

          keep = int(os.environ.get('KEEP_COUNT', '2') or '2')
          packages_filter = [p.strip() for p in os.environ.get('PACKAGES', '').split(',') if p.strip()]
          dry_run = os.environ.get('DRY_RUN', 'true').lower() in ('1', 'true', 'yes')

          # Debian backports (libdrm, libwayland, libxkbcommon, pixman, ...) ship with the
          # upstream sid version (no suffix). This script cleans THEM up and
          # MUST NOT touch our own ~devuandepot packages.
          pool = 'pool/main'
          files = [f for f in os.listdir(pool) if f.endswith('.deb')]
          ours = [f for f in files if '~devuandepot' not in f]

          def deb_pkg_ver(path):
              """Return (package, version) parsed via dpkg-deb -f."""
              out = subprocess.check_output(
                  ['dpkg-deb', '-f', path, 'Package', 'Version'], text=True
              )
              fields = {}
              for line in out.splitlines():
                  if ': ' in line:
                      k, v = line.split(': ', 1)
                      fields[k] = v
              return fields.get('Package', ''), fields.get('Version', '')

          def cmp_desc(a, b):
              """Sort descending by version via dpkg --compare-versions."""
              va, vb = a[1], b[1]
              if subprocess.run(['dpkg', '--compare-versions', va, 'eq', vb],
                                capture_output=True).returncode == 0:
                  return 0
              if subprocess.run(['dpkg', '--compare-versions', va, 'lt', vb],
                                capture_output=True).returncode == 0:
                  return 1   # a < b  -> a goes after b in desc sort
              return -1      # a > b  -> a goes before b

          groups = defaultdict(list)
          for f in ours:
              pkg, ver = deb_pkg_ver(os.path.join(pool, f))
              if not pkg:
                  print(f"WARN: cannot read Package field from {f}, skipping")
                  continue
              if packages_filter and pkg not in packages_filter:
                  continue
              groups[pkg].append((ver, f))

          to_delete = []
          print(f"=== Scanned {len(ours)} Debian backport .deb files in {len(groups)} packages ===")
          for pkg, entries in sorted(groups.items()):
              sorted_entries = sorted(entries, key=cmp_to_key(cmp_desc))
              keep_n = min(keep, len(sorted_entries))
              keeping = sorted_entries[:keep_n]
              dropping = sorted_entries[keep_n:]
              print(f"-- {pkg}: {len(sorted_entries)} versions, keeping {keep_n}:")
              for v, f in keeping:
                  print(f"     KEEP   {v}  ({f})")
              for v, f in dropping:
                  print(f"     DROP   {v}  ({f})")
                  to_delete.append(f)

          print()
          print(f"=== Total to delete: {len(to_delete)} ===")

          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f"DELETE_COUNT={len(to_delete)}\n")
          with open('/tmp/to_delete.txt', 'w') as out:
              for f in to_delete:
                  out.write(f + '\n')
          if dry_run:
              print("DRY-RUN: not touching any files.")
          else:
              print("DRY-RUN=false: staging git rm for the listed files.")
          PYEOF

      - name: Remove old .deb files and regenerate indices
        if: ${{ env.DELETE_COUNT != '0' && inputs.dry-run != 'true' }}
        working-directory: ${{ github.workspace }}
        run: |
          set -eu
          if [ ! -s /tmp/to_delete.txt ]; then
            echo "Nothing to delete."
            exit 0
          fi
          while IFS= read -r f; do
            git rm -f "pool/main/$f"
          done < /tmp/to_delete.txt
          dpkg-scanpackages --arch amd64 --multiversion pool/ > dists/trixie/main/binary-amd64/Packages
          gzip -9fk dists/trixie/main/binary-amd64/Packages
          cd dists/trixie
          cat > Release <<REL
          Origin: devuan-depot
          Label: devuan-depot Personal Repo
          Suite: trixie
          Codename: trixie
          Architectures: amd64
          Components: main
          Date: $(date -Ru)
          REL
          apt-ftparchive release . >> Release

      - name: Import GPG key
        if: ${{ env.DELETE_COUNT != '0' && inputs.dry-run != 'true' }}
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Sign Release
        if: ${{ env.DELETE_COUNT != '0' && inputs.dry-run != 'true' }}
        working-directory: ${{ github.workspace }}/dists/trixie
        run: |
          gpg --batch --yes \
            --default-key "${{ secrets.GPG_KEY_ID }}" -abs -o Release.gpg Release
          gpg --batch --yes \
            --default-key "${{ secrets.GPG_KEY_ID }}" --clearsign -o InRelease Release

      - name: Commit and push
        if: ${{ env.DELETE_COUNT != '0' && inputs.dry-run != 'true' }}
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add pool dists
          git commit -m "chore(pool): cleanup old backport versions (keep-count=${{ inputs.keep-count }})"
          git push