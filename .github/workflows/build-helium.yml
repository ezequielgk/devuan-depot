name: Build Helium Browser .deb

on:
  workflow_dispatch:
  schedule:
    # Run once a week (Sunday at midnight)
    - cron: '0 0 * * 0'

jobs:
  fetch:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Fetch latest release and check versions
        id: check
        run: |
          echo "Fetching latest release data from imputnet/helium-linux..."
          LATEST_JSON=$(curl -s https://api.github.com/repos/imputnet/helium-linux/releases/latest)
          
          DOWNLOAD_URL=$(echo "$LATEST_JSON" | jq -r '.assets[] | select(.name | endswith("_amd64.deb")) | .browser_download_url')
          FILENAME=$(echo "$LATEST_JSON" | jq -r '.assets[] | select(.name | endswith("_amd64.deb")) | .name')
          
          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
            echo "ERROR: Could not find amd64 .deb in the latest release."
            exit 1
          fi
          
          # Extract upstream version from filename (e.g. helium-bin_0.14.9.1-1_amd64.deb -> 0.14.9.1-1)
          UPSTREAM_VERSION=$(echo "$FILENAME" | sed 's/helium-bin_\(.*\)_amd64.deb/\1/')
          TARGET_VERSION="${UPSTREAM_VERSION}~devuandepot"
          
          echo "Upstream version: $UPSTREAM_VERSION"
          echo "Target version: $TARGET_VERSION"
          
          # Check if this version is already in our repository
          echo "Checking devuan-depot Packages index..."
          if curl -s https://ezequielgk.github.io/devuan-depot/dists/trixie/main/binary-amd64/Packages | grep -A 5 "^Package: helium-bin$" | grep -q "^Version: ${TARGET_VERSION}$"; then
            echo "Version $TARGET_VERSION is already in the repository. Skipping update."
            echo "should_run=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "New version found. Downloading..."
          curl -sLO "$DOWNLOAD_URL"
          
          echo "Repackaging $FILENAME to customize it..."
          mkdir -p pkgroot
          dpkg-deb -R "$FILENAME" pkgroot/
          
          # Modify DEBIAN/control
          sed -i "s/^Version: .*/Version: $TARGET_VERSION/" pkgroot/DEBIAN/control
          sed -i 's/^Maintainer: .*/Maintainer: Zeke Ezequielgk <ezequieldtz@tuta.io>/' pkgroot/DEBIAN/control
          
          # Rebuild the .deb
          rm "$FILENAME"
          dpkg-deb --build --root-owner-group pkgroot "helium-bin_${TARGET_VERSION}_amd64.deb"
          
          echo "should_run=true" >> $GITHUB_OUTPUT

      - name: Upload Artifact
        if: steps.check.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: helium-deb
          path: "*.deb"

  publish:
    needs: fetch
    if: needs.fetch.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages

      - uses: actions/download-artifact@v4
        with:
          name: helium-deb
          path: incoming

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Add to pool and regenerate indices
        run: |
          sudo apt-get install -y dpkg-dev
          mkdir -p pool/main dists/trixie/main/binary-amd64
          cp incoming/*.deb pool/main/
          dpkg-scanpackages --arch amd64 --multiversion pool/ > dists/trixie/main/binary-amd64/Packages
          gzip -9fk dists/trixie/main/binary-amd64/Packages

      - name: Generate and sign Release
        run: |
          cd dists/trixie
          cat > Release <<REL
          Origin: devuan-depot
          Label: devuan-depot Personal Repo
          Suite: trixie
          Codename: trixie
          Architectures: amd64
          Components: main
          Date: $(date -Ru)
          REL
          apt-ftparchive release . >> Release
          gpg --batch --yes \
            --default-key "${{ secrets.GPG_KEY_ID }}" -abs -o Release.gpg Release
          gpg --batch --yes \
            --default-key "${{ secrets.GPG_KEY_ID }}" --clearsign -o InRelease Release

      - name: Commit and push to gh-pages
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add pool dists
          git commit -m "Update helium-bin" || echo "No changes"
          git push
