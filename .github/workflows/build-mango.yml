name: Build MangoWC .deb
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    steps:
      # The composite action lives in the default branch; sparse-checkout
      # is enough — the build downloads its own upstream source below.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl jq wget

          # Add the devuan-depot repository to install backports, wlroots0.20 and scenefx0.5
          echo "deb [trusted=yes] https://ezequielgk.github.io/devuan-depot trixie main" > /etc/apt/sources.list.d/devuan-depot.list
          apt-get update
          apt-get upgrade -y

          apt-get install -y --no-install-recommends \
            build-essential meson pkg-config cmake git scdoc dpkg-dev \
            wayland-protocols libwayland-dev libpcre2-dev libcjson-dev \
            libpango1.0-dev libcairo2-dev \
            libdrm-dev libgbm-dev libinput-dev libseat-dev libxkbcommon-dev \
            libxcb-dri3-dev libxcb-present-dev libxcb-res0-dev \
            libxcb-render-util0-dev libxcb-ewmh-dev libxcb-icccm4-dev \
            libliftoff-dev libdisplay-info-dev libpixman-1-dev liblcms2-dev \
            hwdata libudev-dev xwayland libxml2-dev bison flex \
            libegl1-mesa-dev libgles2-mesa-dev libvulkan-dev \
            libxcb-composite0-dev libxcb-render0-dev libxcb-xfixes0-dev \
            libxcb-shape0-dev libxcb-errors-dev \
            libvulkan-dev glslang-tools \
            wlroots0.20 scenefx0.5

      - name: Clone mangowm
        run: |
          git clone --depth 1 https://github.com/mangowm/mango.git src/mango

      - name: Compile mango
        working-directory: src/mango
        run: |
          meson setup build --buildtype=release --prefix=/usr --wrap-mode=default -Dwerror=false
          ninja -C build

      - name: Stage pkgroot
        working-directory: src/mango
        run: |
          # Use a short commit hash for the version since we are building from main.
          # Append github.run_number so every re-run of the workflow produces a
          # monotonically higher .deb version (otherwise apt never offers an
          # upgrade when the upstream commit hash did not change — the bug that
          # kept distributing the same 0.0.0+gitcc4fdec indefinitely).
          COMMIT_HASH=$(git rev-parse --short HEAD)
          echo "COMMIT_HASH=${COMMIT_HASH}" >> "$GITHUB_ENV"

          mkdir -p pkgroot/DEBIAN
          DESTDIR=$PWD/pkgroot ninja -C build install

      - name: Resolve shlib dependencies
        id: deps
        uses: ./.github/actions/dpkg-shlibdeps-deps
        with:
          package-name: mangowc
          section: x11
          priority: optional
          maintainer: 'Zeke Ezequielgk <ezequieldtz@tuta.io>'
          # Cover both `mango` and `mmsg`; find-expr handles mmsg being absent.
          find-expr: 'pkgroot/usr/bin -type f -executable'
          description-stub: 'mangowc stub'
          working-directory: src/mango

      - name: Write control and maintainer scripts
        working-directory: src/mango
        env:
          DEPS: ${{ steps.deps.outputs.depends }}
        run: |
          VERSION="0.0.0+git${COMMIT_HASH}+${{ github.run_number }}~devuandepot"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

          cat > pkgroot/DEBIAN/control <<CTRL
          Package: mangowc
          Version: ${VERSION}
          Section: x11
          Priority: optional
          Architecture: amd64
          Depends: ${DEPS}
          Maintainer: Zeke Ezequielgk <ezequieldtz@tuta.io>
          Description: mangowc - Practical and Powerful wayland compositor (dwm but wayland)
           Practical and Powerful wayland compositor (dwm but wayland).
          CTRL

          cat > pkgroot/DEBIAN/postinst <<'EOF'
          #!/bin/sh
          set -e
          ldconfig
          if [ -x /usr/bin/update-desktop-database ]; then
            update-desktop-database -q /usr/share/applications || true
          fi
          exit 0
          EOF

          cat > pkgroot/DEBIAN/postrm <<'EOF'
          #!/bin/sh
          set -e
          ldconfig
          if [ -x /usr/bin/update-desktop-database ]; then
            update-desktop-database -q /usr/share/applications || true
          fi
          exit 0
          EOF

          chmod 755 pkgroot/DEBIAN/postinst pkgroot/DEBIAN/postrm

          dpkg-deb --build --root-owner-group pkgroot "mangowc_${VERSION}_amd64.deb"
          mv "mangowc_${VERSION}_amd64.deb" ..

      - uses: actions/upload-artifact@v4
        with:
          name: mangowc-deb
          path: src/mangowc_*_amd64.deb

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages

      - uses: actions/download-artifact@v4
        with:
          name: mangowc-deb
          path: incoming

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Add to pool and regenerate indices
        run: |
          sudo apt-get install -y dpkg-dev
          mkdir -p pool/main dists/trixie/main/binary-amd64
          cp incoming/*.deb pool/main/
          dpkg-scanpackages --arch amd64 pool/ > dists/trixie/main/binary-amd64/Packages
          gzip -9fk dists/trixie/main/binary-amd64/Packages

      - name: Generate and sign Release
        run: |
          cd dists/trixie
          cat > Release <<REL
          Origin: devuan-depot
          Label: devuan-depot Personal Repo
          Suite: trixie
          Codename: trixie
          Architectures: amd64
          Components: main
          Date: $(date -Ru)
          REL
          apt-ftparchive release . >> Release
          gpg --batch --yes \
            --default-key "${{ secrets.GPG_KEY_ID }}" -abs -o Release.gpg Release
          gpg --batch --yes \
            --default-key "${{ secrets.GPG_KEY_ID }}" --clearsign -o InRelease Release

      - name: Commit and push to gh-pages
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add pool dists
          git commit -m "Add/Update mangowc" || echo "No changes"
          git push