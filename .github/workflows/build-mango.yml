name: Build MangoWC .deb
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential meson pkg-config cmake git scdoc dpkg-dev ca-certificates \
            wayland-protocols libwayland-dev libpcre2-dev libcjson-dev \
            libpango1.0-dev libcairo2-dev \
            libdrm-dev libgbm-dev libinput-dev libseat-dev libxkbcommon-dev \
            libxcb-dri3-dev libxcb-present-dev libxcb-res0-dev \
            libxcb-render-util0-dev libxcb-ewmh-dev libxcb-icccm4-dev \
            libliftoff-dev libdisplay-info-dev libpixman-1-dev \
            hwdata libudev-dev xwayland

      - name: Clone wayland, wlroots, scenefx and mangowm
        run: |
          # 0. Wayland 1.24.0
          git clone --branch 1.24.0 --depth 1 https://gitlab.freedesktop.org/wayland/wayland.git src/wayland

          # 1. wlroots 0.20.2
          git clone --branch 0.20.2 --depth 1 https://gitlab.freedesktop.org/wlroots/wlroots.git src/wlroots
          
          # 2. scenefx 0.5
          git clone --branch 0.5 --depth 1 https://github.com/wlrfx/scenefx.git src/scenefx
          
          # 3. mangowm (latest from main)
          git clone --depth 1 https://github.com/mangowm/mango.git src/mango

      - name: Compile and install Wayland 1.24.0
        working-directory: src/wayland
        run: |
          meson setup build --prefix=/usr -Ddocumentation=false
          ninja -C build install

      - name: Compile and install wlroots
        working-directory: src/wlroots
        run: |
          meson setup build --prefix=/usr
          ninja -C build install

      - name: Compile and install scenefx
        working-directory: src/scenefx
        run: |
          meson setup build --prefix=/usr
          ninja -C build install

      - name: Compile mangowm
        working-directory: src/mango
        run: |
          meson setup build --buildtype=release --prefix=/usr
          ninja -C build

      - name: Package .deb
        working-directory: src/mango
        run: |
          # Use a short commit hash for the version since we are building from main
          COMMIT_HASH=$(git rev-parse --short HEAD)
          VERSION="0.0.0+git${COMMIT_HASH}"
          
          mkdir -p pkgroot/DEBIAN
          DESTDIR=$PWD/pkgroot ninja -C build install

          DEPS=$(dpkg-shlibdeps --ignore-missing-info -O \
            $(find pkgroot/usr/bin pkgroot/usr/lib -type f -executable 2>/dev/null) \
            2>/dev/null | sed 's/^shlibs:Depends=//' || echo "")

          cat > pkgroot/DEBIAN/control <<CTRL
          Package: mangowm
          Version: ${VERSION}
          Section: x11
          Priority: optional
          Architecture: amd64
          Depends: ${DEPS}
          Maintainer: Zeke Ezequielgk <ezequieldtz@tuta.io>
          Description: MangoWM - A Wayland compositor
           An i3-compatible Wayland compositor with visual effects.
          CTRL

          cat > pkgroot/DEBIAN/postinst <<'EOF'
          #!/bin/sh
          set -e
          ldconfig
          if [ -x /usr/bin/update-desktop-database ]; then
            update-desktop-database -q /usr/share/applications || true
          fi
          exit 0
          EOF

          cat > pkgroot/DEBIAN/postrm <<'EOF'
          #!/bin/sh
          set -e
          ldconfig
          if [ -x /usr/bin/update-desktop-database ]; then
            update-desktop-database -q /usr/share/applications || true
          fi
          exit 0
          EOF

          chmod 755 pkgroot/DEBIAN/postinst pkgroot/DEBIAN/postrm

          dpkg-deb --build --root-owner-group pkgroot "mangowm_${VERSION}_amd64.deb"
          mv "mangowm_${VERSION}_amd64.deb" ..

      - uses: actions/upload-artifact@v4
        with:
          name: mangowm-deb
          path: src/mangowm_*_amd64.deb

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages

      - uses: actions/download-artifact@v4
        with:
          name: mangowm-deb
          path: incoming

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Add to pool and regenerate indices
        run: |
          sudo apt-get install -y dpkg-dev
          mkdir -p pool/main dists/trixie/main/binary-amd64
          cp incoming/*.deb pool/main/
          dpkg-scanpackages --arch amd64 pool/ > dists/trixie/main/binary-amd64/Packages
          gzip -9fk dists/trixie/main/binary-amd64/Packages

      - name: Generate and sign Release
        run: |
          cd dists/trixie
          cat > Release <<REL
          Origin: devuan-depot
          Label: devuan-depot Personal Repo
          Suite: trixie
          Codename: trixie
          Architectures: amd64
          Components: main
          Date: $(date -Ru)
          REL
          apt-ftparchive release . >> Release
          gpg --batch --yes \
            --default-key "${{ secrets.GPG_KEY_ID }}" -abs -o Release.gpg Release
          gpg --batch --yes \
            --default-key "${{ secrets.GPG_KEY_ID }}" --clearsign -o InRelease Release

      - name: Commit and push to gh-pages
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add pool dists
          git commit -m "Add/Update mangowm" || echo "No changes"
          git push
