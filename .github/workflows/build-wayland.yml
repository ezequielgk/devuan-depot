name: Build wayland .deb
on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - branch: "1.24.0"
            pkg_name: "wayland1.24"
            
    runs-on: ubuntu-latest
    container:
      image: debian:trixie

    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential meson pkg-config cmake git ca-certificates curl jq \
            libffi-dev libexpat1-dev libxml2-dev

      - name: Clone Wayland
        run: |
          git clone --branch ${{ matrix.branch }} --depth 1 https://gitlab.freedesktop.org/wayland/wayland.git src
          cd src
          WAYLAND_VERSION=$(git rev-parse --short HEAD)
          echo "WAYLAND_VERSION=${{ matrix.branch }}~git${WAYLAND_VERSION}" >> $GITHUB_ENV

      - name: Compile Wayland
        working-directory: src
        run: |
          # Instalamos en /opt/ para no pisar las librerías del sistema (Trixie 1.23.1)
          meson setup build --buildtype=release --prefix=/opt/${{ matrix.pkg_name }} -Ddocumentation=false
          ninja -C build

      - name: Package .deb
        working-directory: src
        run: |
          mkdir -p pkgroot/DEBIAN
          DESTDIR=$PWD/pkgroot ninja -C build install

          # Encontramos dependencias
          DEPS=$(dpkg-shlibdeps --ignore-missing-info -O \
            $(find pkgroot/opt/${{ matrix.pkg_name }}/lib -name "*.so*" -type f 2>/dev/null) \
            2>/dev/null | sed 's/^shlibs:Depends=//' || echo "")

          cat > pkgroot/DEBIAN/control <<CTRL
          Package: ${{ matrix.pkg_name }}
          Version: ${WAYLAND_VERSION}
          Section: libs
          Priority: optional
          Architecture: amd64
          Depends: ${DEPS}
          Maintainer: Zeke Ezequielgk <ezequieldtz@tuta.io>
          Description: Wayland (${{ matrix.branch }}) installed in /opt/${{ matrix.pkg_name }} (Backport)
          CTRL

          cat > pkgroot/DEBIAN/postinst <<EOF
          #!/bin/sh
          set -e
          echo "/opt/${{ matrix.pkg_name }}/lib/x86_64-linux-gnu" > /etc/ld.so.conf.d/${{ matrix.pkg_name }}.conf
          echo "/opt/${{ matrix.pkg_name }}/lib" >> /etc/ld.so.conf.d/${{ matrix.pkg_name }}.conf
          ldconfig
          exit 0
          EOF

          cat > pkgroot/DEBIAN/postrm <<EOF
          #!/bin/sh
          set -e
          rm -f /etc/ld.so.conf.d/${{ matrix.pkg_name }}.conf
          ldconfig
          exit 0
          EOF
          chmod 755 pkgroot/DEBIAN/postinst pkgroot/DEBIAN/postrm

          dpkg-deb --build --root-owner-group pkgroot "${{ matrix.pkg_name }}_${WAYLAND_VERSION}_amd64.deb"
          mv "${{ matrix.pkg_name }}_${WAYLAND_VERSION}_amd64.deb" ..

      - uses: actions/upload-artifact@v4
        with:
          name: wayland-deb-${{ matrix.pkg_name }}
          path: ${{ matrix.pkg_name }}_*_amd64.deb

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages

      - uses: actions/download-artifact@v4
        with:
          pattern: wayland-deb-*
          path: incoming
          merge-multiple: true

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Add to pool and regenerate indices
        run: |
          sudo apt-get install -y dpkg-dev
          mkdir -p pool/main dists/trixie/main/binary-amd64
          cp incoming/*.deb pool/main/
          dpkg-scanpackages --arch amd64 pool/ > dists/trixie/main/binary-amd64/Packages
          gzip -9fk dists/trixie/main/binary-amd64/Packages

      - name: Generate and sign Release
        run: |
          cd dists/trixie
          cat > Release <<REL
          Origin: devuan-depot
          Label: devuan-depot Personal Repo
          Suite: trixie
          Codename: trixie
          Architectures: amd64
          Components: main
          Date: $(date -Ru)
          REL
          apt-ftparchive release . >> Release
          gpg --batch --yes \
            --default-key "${{ secrets.GPG_KEY_ID }}" -abs -o Release.gpg Release
          gpg --batch --yes \
            --default-key "${{ secrets.GPG_KEY_ID }}" --clearsign -o InRelease Release

      - name: Commit and push to gh-pages
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add pool dists
          git commit -m "Update wayland backport packages" || echo "No changes"
          git push
