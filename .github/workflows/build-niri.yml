name: Build Niri .deb
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            gcc clang libudev-dev libgbm-dev libxkbcommon-dev libegl1-mesa-dev \
            libwayland-dev libinput-dev libdbus-1-dev libsystemd-dev libseat-dev \
            libpipewire-0.3-dev libpango1.0-dev libdisplay-info-dev \
            libclang-dev \
            cargo rustc pkg-config cmake git dpkg-dev ca-certificates curl jq

      - name: Clone Niri
        run: |
          # Obtenemos el último tag oficial de Niri
          LATEST_TAG=$(curl -sL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/YaLTeR/niri/tags | jq -r '.[0].name')
          echo "Obtained latest version: $LATEST_TAG"
          echo "NIRI_VERSION=$LATEST_TAG" >> $GITHUB_ENV
          
          git clone --branch $LATEST_TAG --depth 1 https://github.com/YaLTeR/niri.git src

      - name: Compile
        working-directory: src
        run: |
          cargo build --release

      - name: Package .deb
        working-directory: src
        run: |
          # Quitamos la 'v' si el tag la tuviera (ej: v0.1.0 -> 0.1.0)
          VERSION="${NIRI_VERSION#v}"
          mkdir -p pkgroot/DEBIAN
          mkdir -p pkgroot/usr/bin
          mkdir -p pkgroot/usr/share/wayland-sessions
          
          # Copiamos los binarios principales
          cp target/release/niri pkgroot/usr/bin/
          if [ -f target/release/niri-msg ]; then
            cp target/release/niri-msg pkgroot/usr/bin/
          fi
          
          # Copiamos el archivo desktop para que aparezca en el Display Manager
          if [ -f resources/niri.desktop ]; then
            cp resources/niri.desktop pkgroot/usr/share/wayland-sessions/
          fi

          # dpkg-shlibdeps necesita un debian/control en el cwd para funcionar
          mkdir -p debian
          cat > debian/control <<'CTRLSTUB'
          Source: niri
          Section: x11
          Priority: optional
          Maintainer: Zeke Ezequielgk <ezequieldtz@tuta.io>

          Package: niri
          Architecture: amd64
          Description: stub
          CTRLSTUB

          RAW_DEPS=$(dpkg-shlibdeps -O \
            $(find pkgroot/usr/bin -type f -executable))
          if [ $? -ne 0 ]; then
            echo "ERROR: dpkg-shlibdeps fallo, revisar el log arriba"
            exit 1
          fi
          DEPS=$(echo "$RAW_DEPS" | sed 's/^shlibs:Depends=//')
          echo "=== Resolved Depends: ${DEPS} ==="

          cat > pkgroot/DEBIAN/control <<CTRL
          Package: niri
          Version: ${VERSION}
          Section: x11
          Priority: optional
          Architecture: amd64
          Depends: ${DEPS}
          Recommends: xwayland-satellite
          Maintainer: Zeke Ezequielgk <ezequieldtz@tuta.io>
          Description: Niri - A scrollable-tiling Wayland compositor
           Niri is a scrollable-tiling Wayland compositor.
          CTRL

          cat > pkgroot/DEBIAN/postinst <<'EOF'
          #!/bin/sh
          set -e
          if [ -x /usr/bin/update-desktop-database ]; then
            update-desktop-database -q /usr/share/applications || true
          fi
          exit 0
          EOF

          cat > pkgroot/DEBIAN/postrm <<'EOF'
          #!/bin/sh
          set -e
          if [ -x /usr/bin/update-desktop-database ]; then
            update-desktop-database -q /usr/share/applications || true
          fi
          exit 0
          EOF

          chmod 755 pkgroot/DEBIAN/postinst pkgroot/DEBIAN/postrm

          dpkg-deb --build --root-owner-group pkgroot "niri_${VERSION}_amd64.deb"
          mv "niri_${VERSION}_amd64.deb" ..

      - uses: actions/upload-artifact@v4
        with:
          name: niri-deb
          path: niri_*_amd64.deb

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages

      - uses: actions/download-artifact@v4
        with:
          name: niri-deb
          path: incoming

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Add to pool and regenerate indices
        run: |
          sudo apt-get install -y dpkg-dev
          mkdir -p pool/main dists/trixie/main/binary-amd64
          cp incoming/*.deb pool/main/
          dpkg-scanpackages --arch amd64 pool/ > dists/trixie/main/binary-amd64/Packages
          gzip -9fk dists/trixie/main/binary-amd64/Packages

      - name: Generate and sign Release
        run: |
          cd dists/trixie
          cat > Release <<REL
          Origin: devuan-depot
          Label: devuan-depot Personal Repo
          Suite: trixie
          Codename: trixie
          Architectures: amd64
          Components: main
          Date: $(date -Ru)
          REL
          apt-ftparchive release . >> Release
          gpg --batch --yes \
            --default-key "${{ secrets.GPG_KEY_ID }}" -abs -o Release.gpg Release
          gpg --batch --yes \
            --default-key "${{ secrets.GPG_KEY_ID }}" --clearsign -o InRelease Release

      - name: Commit and push to gh-pages
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add pool dists
          git commit -m "Add/Update niri" || echo "No changes"
          git push
