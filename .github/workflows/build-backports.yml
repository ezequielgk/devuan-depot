name: Build Debian Backports
on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - package: "wayland"
          - package: "libdrm"
          - package: "libxkbcommon"
          - package: "wayland-protocols"
          - package: "libdisplay-info"
          - package: "libliftoff"
          - package: "pixman"
          
    runs-on: ubuntu-latest
    container:
      image: debian:trixie

    steps:
      - name: Setup Debian Sid source repository
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl gnupg dpkg-dev devscripts build-essential fakeroot
          
          # Add sid source repo for downloading source packages
          echo "deb-src http://deb.debian.org/debian sid main" > /etc/apt/sources.list.d/sid-src.list
          
          # Add our own repo so we can use previously built backports (like libwayland-dev 1.26.0) to build newer ones
          echo "deb [trusted=yes] https://ezequielgk.github.io/devuan-depot trixie main" > /etc/apt/sources.list.d/devuan-depot.list
          
          apt-get update

      - name: Build backport
        run: |
          mkdir build
          cd build
          
          # Install build dependencies for the package using Trixie's packages
          apt-get build-dep -y ${{ matrix.package }}/sid
          
          # Download source and compile
          apt-get source -b ${{ matrix.package }}/sid

      - uses: actions/upload-artifact@v4
        with:
          name: backport-debs-${{ matrix.package }}
          path: build/*.deb

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages

      - uses: actions/download-artifact@v8
        with:
          pattern: backport-debs-*
          path: incoming
          merge-multiple: true

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Add to pool and regenerate indices
        run: |
          sudo apt-get install -y dpkg-dev
          mkdir -p pool/main dists/trixie/main/binary-amd64
          
          # Move all generated debs to the pool
          cp incoming/*.deb pool/main/
          
          dpkg-scanpackages --arch amd64 --multiversion pool/ > dists/trixie/main/binary-amd64/Packages
          gzip -9fk dists/trixie/main/binary-amd64/Packages

      - name: Generate and sign Release
        run: |
          cd dists/trixie
          cat > Release <<REL
          Origin: devuan-depot
          Label: devuan-depot Personal Repo
          Suite: trixie
          Codename: trixie
          Architectures: amd64
          Components: main
          Date: $(date -Ru)
          REL
          apt-ftparchive release . >> Release
          gpg --batch --yes \
            --default-key "${{ secrets.GPG_KEY_ID }}" -abs -o Release.gpg Release
          gpg --batch --yes \
            --default-key "${{ secrets.GPG_KEY_ID }}" --clearsign -o InRelease Release

      - name: Commit and push to gh-pages
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add pool dists
          git commit -m "Add backports for wayland and libdrm" || echo "No changes"
          git push
