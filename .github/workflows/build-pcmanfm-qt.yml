name: Build PCManFM-Qt .deb
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    steps:
      # Composite action lives in the default branch; sparse-checkout only.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            cmake gcc g++ build-essential git dpkg-dev ca-certificates curl jq \
            lxqt-build-tools libfm-qt-dev liblayershellqtinterface-dev \
            qt6-base-dev qt6-tools-dev qt6-l10n-tools qt6-translations-l10n \
            pkg-config libglib2.0-dev libxkbcommon-dev

      - name: Clone PCManFM-Qt
        run: |
          LATEST_TAG="2.1.0"
          echo "Obtained latest version: $LATEST_TAG"
          echo "PCMANFM_QT_VERSION=$LATEST_TAG" >> $GITHUB_ENV

          git clone --branch $LATEST_TAG --depth 1 https://github.com/lxqt/pcmanfm-qt.git src

      - name: Compile
        working-directory: src
        run: |
          mkdir build && cd build
          cmake -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=Release ..
          make -j$(nproc)

      - name: Stage pkgroot
        working-directory: src
        run: |
          # Append github.run_number instead of a fixed "99" so every re-run
          # produces a strictly higher .deb version than the previous pool copy.
          VERSION="${PCMANFM_QT_VERSION#v}.$(date -u +%Y%m%d).${{ github.run_number }}~devuandepot"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

          DESTDIR="$(pwd)/pkgroot"
          (cd build && make install DESTDIR="$DESTDIR")
          mkdir -p pkgroot/DEBIAN

      - name: Resolve shlib dependencies
        id: deps
        uses: ./.github/actions/dpkg-shlibdeps-deps
        with:
          package-name: pcmanfm-qt
          section: x11
          priority: optional
          maintainer: 'Zeke Ezequielgk <ezequieldtz@tuta.io>'
          # PCManFM-Qt ships binaries plus private libs merged into usr/lib.
          find-expr: 'pkgroot/usr/bin pkgroot/usr/lib -type f -executable'
          description-stub: 'pcmanfm-qt stub'
          working-directory: src

      - name: Write control file and build .deb
        working-directory: src
        env:
          DEPS: ${{ steps.deps.outputs.depends }}
        run: |
          cat > pkgroot/DEBIAN/control <<CTRL
          Package: pcmanfm-qt
          Version: ${VERSION}
          Section: x11
          Priority: optional
          Architecture: amd64
          Depends: ${DEPS}
          Maintainer: Zeke Ezequielgk <ezequieldtz@tuta.io>
          Description: PCManFM-Qt - extremely fast and lightweight file manager
           Extremely fast and lightweight file manager, part of LXQt.
          CTRL

          dpkg-deb --build --root-owner-group pkgroot "pcmanfm-qt_${VERSION}_amd64.deb"
          mv "pcmanfm-qt_${VERSION}_amd64.deb" ..

      - uses: actions/upload-artifact@v4
        with:
          name: pcmanfm-qt-deb
          path: pcmanfm-qt_*_amd64.deb

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages

      - uses: actions/download-artifact@v4
        with:
          name: pcmanfm-qt-deb
          path: incoming

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Add to pool and regenerate indices
        run: |
          sudo apt-get install -y dpkg-dev
          mkdir -p pool/main dists/trixie/main/binary-amd64
          cp incoming/*.deb pool/main/
          dpkg-scanpackages --arch amd64 --multiversion pool/ > dists/trixie/main/binary-amd64/Packages
          gzip -9fk dists/trixie/main/binary-amd64/Packages

      - name: Generate and sign Release
        run: |
          cd dists/trixie
          cat > Release <<REL
          Origin: devuan-depot
          Label: devuan-depot Personal Repo
          Suite: trixie
          Codename: trixie
          Architectures: amd64
          Components: main
          Date: $(date -Ru)
          REL
          apt-ftparchive release . >> Release
          gpg --batch --yes \
            --default-key "${{ secrets.GPG_KEY_ID }}" -abs -o Release.gpg Release
          gpg --batch --yes \
            --default-key "${{ secrets.GPG_KEY_ID }}" --clearsign -o InRelease Release

      - name: Commit and push to gh-pages
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add pool dists
          git commit -m "Add/Update pcmanfm-qt" || echo "No changes"
          git push