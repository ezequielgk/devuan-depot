name: Compiler Debug (Bar)
on:
  workflow_dispatch:
  push:

jobs:
  debug-compilation:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: debian:trixie
    steps:
      - name: Setup APT and dependencies
        run: |
          apt-get update
          apt-get install -y git build-essential pkg-config jq wget foot
          # Setup custom depot for wlroots0.20
          echo "deb [trusted=yes] https://ezequielgk.github.io/devuan-depot trixie main" > /etc/apt/sources.list.d/devuan-depot.list
          apt-get update
          apt-get install -y wlroots0.20 wayland-protocols libwayland-dev libxkbcommon-dev libinput-dev libpixman-1-dev libfcft-dev libxcb1-dev libxcb-icccm4-dev libegl-dev libgbm-dev libgles-dev libvulkan-dev liblcms2-dev libseat-dev libdisplay-info-dev libdrm-dev libliftoff-dev libxcb-composite0-dev libxcb-ewmh-dev libxcb-render0-dev libxcb-res0-dev libxcb-xfixes0-dev libxcb-errors-dev

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Prepare Base v0.9 and Patch
        run: |
          git clone --branch v0.9 --depth 1 https://codeberg.org/dwl/dwl.git dwl-test
          cd dwl-test
          git clone --depth 1 https://codeberg.org/dwl/dwl-patches.git ../patches
          git apply --include=drwl.h ../patches/patches/bar/bar.patch || true
          git apply ../.github/workflows/rebase_bar.patch
          cp config.def.h config.h
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git config --global --add safe.directory /__w/devuan-depot/devuan-depot

      - name: Trigger Clean Compiler Run
        run: |
          cd dwl-test
          echo "==== STARTING COMPILER RUN ===="
          make || exit 1
          
      - name: Test Headless Render and Window Mapping
        run: |
          cd dwl-test
          mkdir -p /tmp/xdg && XDG_RUNTIME_DIR=/tmp/xdg WLR_BACKENDS=headless ./dwl -s 'foot -e sh -c "echo Hello from Foot; sleep 2" & sleep 3; kill $PPID' > ../dwl-headless.log 2>&1 || true
          cd ..
          git pull origin main
          git add dwl-headless.log
          git commit -m "Upload CI headless log"
          git push origin main
