name: Compiler Debug (Bar)
on:
  workflow_dispatch:

jobs:
  debug-compilation:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    steps:
      - name: Setup APT and dependencies
        run: |
          apt-get update
          apt-get install -y git build-essential pkg-config jq wget
          # Setup custom depot for wlroots0.20
          echo "deb [trusted=yes] https://ezequielgk.github.io/devuan-depot trixie main" > /etc/apt/sources.list.d/devuan-depot.list
          apt-get update
          apt-get install -y wlroots0.20 wayland-protocols libwayland-dev libxkbcommon-dev libinput-dev libpixman-1-dev libfcft-dev libxcb1-dev libxcb-icccm4-dev libegl-dev libgbm-dev libgles-dev libvulkan-dev liblcms2-dev libseat-dev libdisplay-info-dev libdrm-dev libliftoff-dev libxcb-composite0-dev libxcb-ewmh-dev libxcb-render0-dev libxcb-res0-dev libxcb-xfixes0-dev libxcb-errors-dev

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Prepare Base v0.9
        run: |
          git clone --branch v0.9 --depth 1 https://codeberg.org/dwl/dwl.git dwl-test
          cd dwl-test

          sed -i '/static const float bordercolor\[\]/d' config.def.h
          sed -i '/static const float focuscolor\[\]/d' config.def.h
          sed -i '/static const float urgentcolor\[\]/d' config.def.h
          sed -i 's/static const float rootcolor\[\].*/static const int showbar = 1;\nstatic const int topbar = 1;\nstatic const char \*fonts\[\] = {"monospace:size=10"};\nstatic const float rootcolor\[\] = COLOR(0x000000ff);/g' config.def.h
          
          sed -i '/static const float fullscreen_bg\[\]/i static uint32_t colors[][3] = {\n\t[SchemeNorm] = { 0xbbbbbbff, 0x222222ff, 0x444444ff },\n\t[SchemeSel]  = { 0xeeeeeeff, 0x005577ff, 0x005577ff },\n\t[SchemeUrg]  = { 0, 0, 0x770000ff },\n};\n' config.def.h
          sed -i 's/#define TAGCOUNT (9)/static char \*tags\[\] = { "1", "2", "3", "4", "5", "6", "7", "8", "9" };/g' config.def.h
          sed -i '/\/\* tagging - TAGCOUNT must be no greater than 31 \*\//d' config.def.h

      - name: Fetch drwl files from drwl repository
        run: |
          cd dwl-test
          # Clonamos los parches oficiales para extraer drwl.h
          git clone --depth 1 https://codeberg.org/dwl/dwl-patches.git ../patches
          # Como drwl.h se empaqueta nuevo (create mode) y aplica 100% sin conflictos,
          # lo extraemos inyectando el diff con patch.
          git apply --include=drwl.h ../patches/patches/bar/bar.patch || true
          
          # Restauramos el makefile de dwl.c a su estado antes del bar para que pase, ya que reviví un espejismo de drwl.o
          git checkout Makefile
      - name: Fix Hunk 1 Compilation errors in core
        run: |
          cd dwl-test
          
          sed -i '/#include "util.h"/i enum { SchemeNorm, SchemeSel, SchemeUrg }; \/\* color schemes \*\/\n' dwl.c
          sed -i 's/(1u << TAGCOUNT)/(1u << LENGTH(tags))/g' dwl.c
          
          sed -i 's/focuscolor/(float\[\])COLOR(colors[SchemeSel][2])/g' dwl.c
          sed -i 's/bordercolor/(float\[\])COLOR(colors[SchemeNorm][2])/g' dwl.c
          sed -i 's/urgentcolor/(float\[\])COLOR(colors[SchemeUrg][2])/g' dwl.c

      - name: Introduce Hunks 1 to 4 from dwl.c for Bar structure
        run: |
          cd dwl-test
          sed -i '/#include "util.h"/i #include "drwl.h"\n' dwl.c
          sed -i '/#include <math.h>/a #include <libdrm/drm_fourcc.h>\n#include <fcntl.h>' dwl.c
          sed -i '/#define TAGMASK/i #define TEXTW(mon, text)        (drwl_font_getwidth(mon->drw, text) + mon->lrpad)' dwl.c
          sed -i '/enum { XDGShell/i enum { ClkTagBar, ClkLtSymbol, ClkStatus, ClkTitle, ClkClient, ClkRoot }; /* clicks */' dwl.c
          
          sed -i '/unsigned int mod;/i \tunsigned int click;' dwl.c
          
          sed -i 's/{ WLR_MODIFIER/{ 0, WLR_MODIFIER/g' config.def.h
          cp config.def.h config.h

      - name: Trigger Clean Compiler Run
        run: |
          cd dwl-test
          echo "==== STARTING COMPILER RUN ===="
          make || exit 1
