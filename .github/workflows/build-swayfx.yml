name: Build SwayFX .deb
on:
  workflow_dispatch:
  push:
    tags:
      - 'swayfx-v*'

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    steps:
      - name: Instalar git y dependencias de build
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            meson pkg-config cmake git scdoc dpkg-dev ca-certificates \
            wayland-protocols libwayland-dev libpcre2-dev libjson-c-dev \
            libpango1.0-dev libcairo2-dev libgdk-pixbuf-2.0-dev \
            libdrm-dev libgbm-dev libinput-dev libseat-dev libxkbcommon-dev \
            libxcb-dri3-dev libxcb-present-dev libxcb-res0-dev \
            libxcb-render-util0-dev libxcb-ewmh-dev libxcb-icccm4-dev \
            libliftoff-dev libdisplay-info-dev liblcms2-dev libpixman-1-dev \
            libgles2-mesa-dev hwdata libudev-dev

      - name: Clonar SwayFX y subproyectos (wlroots + scenefx)
        run: |
          git clone --branch 0.5.3 --depth 1 https://github.com/WillPower3309/swayfx.git src
          mkdir -p src/subprojects
          cd src/subprojects
          git clone --branch 0.4.1 --depth 1 https://github.com/wlrfx/scenefx.git
          git clone --branch 0.19.0 --depth 1 https://gitlab.freedesktop.org/wlroots/wlroots.git

      - name: Compilar
        working-directory: src
        run: |
          meson setup build --buildtype=release --prefix=/usr
          ninja -C build

      - name: Empaquetar .deb
        working-directory: src
        run: |
          VERSION="0.5.3"
          mkdir -p pkgroot/DEBIAN
          DESTDIR=$PWD/pkgroot ninja -C build install

          DEPS=$(dpkg-shlibdeps --ignore-missing-info -O \
            $(find pkgroot/usr/bin pkgroot/usr/lib -type f -executable 2>/dev/null) \
            2>/dev/null | sed 's/^shlibs:Depends=//' || echo "")

          cat > pkgroot/DEBIAN/control <<CTRL
          Package: swayfx
          Version: ${VERSION}
          Section: x11
          Priority: optional
          Architecture: amd64
          Depends: ${DEPS}
          Maintainer: Zeke Ezequielgk <ezequieldtz@tuta.io>
          Description: SwayFX - Sway con efectos visuales
           Fork de Sway con blur, sombras y esquinas redondeadas.
           Basado en Sway 1.11, wlroots 0.19.0 y scenefx 0.4.1.
          CTRL

          cat > pkgroot/DEBIAN/postinst <<'EOF'
          #!/bin/sh
          set -e
          ldconfig
          if [ -x /usr/bin/update-desktop-database ]; then
            update-desktop-database -q /usr/share/applications || true
          fi
          exit 0
          EOF

          cat > pkgroot/DEBIAN/postrm <<'EOF'
          #!/bin/sh
          set -e
          ldconfig
          if [ -x /usr/bin/update-desktop-database ]; then
            update-desktop-database -q /usr/share/applications || true
          fi
          exit 0
          EOF

          chmod 755 pkgroot/DEBIAN/postinst pkgroot/DEBIAN/postrm

          dpkg-deb --build --root-owner-group pkgroot "swayfx_${VERSION}_amd64.deb"
          mv "swayfx_${VERSION}_amd64.deb" ..

      - uses: actions/upload-artifact@v4
        with:
          name: swayfx-deb
          path: swayfx_*_amd64.deb

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages

      - uses: actions/download-artifact@v4
        with:
          name: swayfx-deb
          path: incoming

      - name: Importar GPG key
        run: echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import

      - name: Agregar al pool y regenerar índices
        run: |
          sudo apt-get install -y dpkg-dev
          mkdir -p pool/main dists/trixie/main/binary-amd64
          cp incoming/*.deb pool/main/
          dpkg-scanpackages --arch amd64 pool/ > dists/trixie/main/binary-amd64/Packages
          gzip -9fk dists/trixie/main/binary-amd64/Packages

      - name: Generar y firmar Release
        run: |
          cd dists/trixie
          cat > Release <<REL
          Origin: rox-apt-repo
          Label: Rox Personal Repo
          Suite: trixie
          Codename: trixie
          Architectures: amd64
          Components: main
          Date: $(date -Ru)
          REL
          apt-ftparchive release . >> Release
          gpg --default-key "${{ secrets.GPG_KEY_ID }}" -abs -o Release.gpg Release
          gpg --default-key "${{ secrets.GPG_KEY_ID }}" --clearsign -o InRelease Release

      - name: Commit y push a gh-pages
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add pool dists
          git commit -m "Actualizar swayfx" || echo "Sin cambios"
          git push