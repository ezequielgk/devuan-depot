name: Build SwayFX .deb
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie

    steps:
      - name: Install git and build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl jq wget
          
          # Add the devuan-depot repository to install wlroots0.19 and scenefx0.4
          echo "deb [trusted=yes] https://ezequielgk.github.io/devuan-depot trixie main" > /etc/apt/sources.list.d/devuan-depot.list
          apt-get update
          
          apt-get install -y --no-install-recommends \
            build-essential meson pkg-config cmake git scdoc dpkg-dev \
            wayland-protocols libwayland-dev libpcre2-dev libjson-c-dev \
            libpango1.0-dev libcairo2-dev libgdk-pixbuf-2.0-dev \
            libdrm-dev libgbm-dev libinput-dev libseat-dev libxkbcommon-dev \
            libxcb-dri3-dev libxcb-present-dev libxcb-res0-dev \
            libxcb-render-util0-dev libxcb-ewmh-dev libxcb-icccm4-dev \
            libliftoff-dev libdisplay-info-dev liblcms2-dev libpixman-1-dev \
            libgles2-mesa-dev hwdata libudev-dev \
            libxcb-composite0-dev libxcb-xfixes0-dev libxcb-errors-dev xwayland \
            libxcb1-dev libxcb-render0-dev libxcb-image0-dev libx11-xcb-dev libxcb-cursor-dev \
            wlroots0.19 scenefx0.4

      - name: Clone SwayFX
        run: |
          # Get the absolute newest tag, even if the author forgot to mark it as "latest"
          LATEST_TAG=$(curl -sL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/WillPower3309/swayfx/tags | jq -r '.[0].name')
          echo "Obtained latest version: $LATEST_TAG"
          echo "SWAYFX_VERSION=$LATEST_TAG" >> $GITHUB_ENV

          git clone --branch $LATEST_TAG --depth 1 https://github.com/WillPower3309/swayfx.git src

      - name: Compile
        working-directory: src
        run: |
          # The subprojects will automatically fallback to the system dependencies we installed via apt
          meson setup build --buildtype=release --prefix=/usr
          ninja -C build

      - name: Package .deb
        working-directory: src
        run: |
          # Remove 'v' from tag if present (e.g. v0.5.2 -> 0.5.2)
          VERSION="${SWAYFX_VERSION#v}"
          mkdir -p pkgroot/DEBIAN
          DESTDIR=$PWD/pkgroot ninja -C build install

          # Modify wayland-sessions desktop file
          mv pkgroot/usr/share/wayland-sessions/sway.desktop pkgroot/usr/share/wayland-sessions/swayfx.desktop
          cat > pkgroot/usr/share/wayland-sessions/swayfx.desktop <<'SESSION'
          [Desktop Entry]
          Name=SwayFX
          Comment=An i3-compatible Wayland compositor with eye candy
          Exec=dbus-run-session sway
          Type=Application
          SESSION

          DEPS=$(dpkg-shlibdeps --ignore-missing-info -O \
            $(find pkgroot/usr/bin pkgroot/usr/lib -type f -executable 2>/dev/null) \
            2>/dev/null | sed 's/^shlibs:Depends=//' || echo "")

          cat > pkgroot/DEBIAN/control <<CTRL
          Package: swayfx
          Version: ${VERSION}
          Section: x11
          Priority: optional
          Architecture: amd64
          Depends: ${DEPS}
          Recommends: seatd
          Maintainer: Zeke Ezequielgk <ezequieldtz@tuta.io>
          Description: SwayFX - Sway but with eye candy!
           Sway fork with blur, shadows and rounded corners.
           Based on Sway 1.11, wlroots 0.19.0 and scenefx 0.4.1.
           Built with Xwayland support enabled.
          CTRL

          cat > pkgroot/DEBIAN/postinst <<'EOF'
          #!/bin/sh
          set -e
          ldconfig
          if [ -x /usr/bin/update-desktop-database ]; then
            update-desktop-database -q /usr/share/applications || true
          fi
          exit 0
          EOF

          cat > pkgroot/DEBIAN/postrm <<'EOF'
          #!/bin/sh
          set -e
          ldconfig
          if [ -x /usr/bin/update-desktop-database ]; then
            update-desktop-database -q /usr/share/applications || true
          fi
          exit 0
          EOF

          chmod 755 pkgroot/DEBIAN/postinst pkgroot/DEBIAN/postrm

          dpkg-deb --build --root-owner-group pkgroot "swayfx_${VERSION}_amd64.deb"
          mv "swayfx_${VERSION}_amd64.deb" ..

      - uses: actions/upload-artifact@v4
        with:
          name: swayfx-deb
          path: swayfx_*_amd64.deb

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages

      - uses: actions/download-artifact@v4
        with:
          name: swayfx-deb
          path: incoming

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Add to pool and regenerate indices
        run: |
          sudo apt-get install -y dpkg-dev
          mkdir -p pool/main dists/trixie/main/binary-amd64
          cp incoming/*.deb pool/main/
          dpkg-scanpackages --arch amd64 pool/ > dists/trixie/main/binary-amd64/Packages
          gzip -9fk dists/trixie/main/binary-amd64/Packages

      - name: Generate and sign Release
        run: |
          cd dists/trixie
          cat > Release <<REL
          Origin: devuan-depot
          Label: devuan-depot Personal Repo
          Suite: trixie
          Codename: trixie
          Architectures: amd64
          Components: main
          Date: $(date -Ru)
          REL
          apt-ftparchive release . >> Release
          gpg --batch --yes \
            --default-key "${{ secrets.GPG_KEY_ID }}" -abs -o Release.gpg Release
          gpg --batch --yes \
            --default-key "${{ secrets.GPG_KEY_ID }}" --clearsign -o InRelease Release

      - name: Commit and push to gh-pages
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add pool dists
          git commit -m "Update swayfx" || echo "No changes"
          git push