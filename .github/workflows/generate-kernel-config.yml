name: Generate Kernel Config - Crystal

on:
  workflow_dispatch:
    inputs:
      trigger_build:
        description: 'Trigger the build workflow after generation?'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    steps:
      - name: Enable deb-src and update
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates
          if [ -f /etc/apt/sources.list.d/debian.sources ]; then
            sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/debian.sources
          else
            echo "deb-src http://deb.debian.org/debian trixie main" >> /etc/apt/sources.list
          fi
          apt-get update

      - name: Install config generation dependencies
        run: |
          apt-get install -y --no-install-recommends \
            build-essential libncurses-dev bison flex libssl-dev libelf-dev bc dpkg-dev git

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download linux source
        run: |
          mkdir -p /build && cd /build
          apt-get source linux
          ls -d linux-*/ | head -1 > /build/srcdir.txt

      - name: Apply base config and manual trims
        run: |
          SRCDIR=$(cat /build/srcdir.txt)
          
          # 1. Download official Debian config to use as generic base
          echo "Fetching generic Debian config..."
          mkdir -p /tmp/debian-kernel
          cd /tmp/debian-kernel
          KERNEL_PKG=$(apt-cache depends linux-image-amd64 | grep Depends | awk '{print $2}')
          apt-get download "$KERNEL_PKG"
          dpkg-deb -x "$KERNEL_PKG"*.deb .
          
          # Copy it to our build tree
          cp boot/config-* "/build/${SRCDIR}/.config"
          
          cd "/build/${SRCDIR}"
          make olddefconfig
          
          # 2. Manual Trims via scripts/config
          echo "Applying manual configuration trims..."
          # GPUs
          scripts/config --disable NOUVEAU
          scripts/config --disable DRM_I915
          scripts/config --disable DRM_RADEON
          scripts/config --disable DRM_NOUVEAU
          
          # Filesystems - Built-in
          scripts/config --enable EXT4_FS
          scripts/config --enable MSDOS_FS
          scripts/config --enable VFAT_FS
          
          # Filesystems - Modules
          scripts/config --module BTRFS_FS
          scripts/config --module XFS_FS
          scripts/config --module JFS_FS
          scripts/config --module REISERFS_FS
          scripts/config --module NTFS_FS
          scripts/config --module NTFS3_FS
          scripts/config --module EXFAT_FS
          
          # Network Filesystems - Disabled
          scripts/config --disable NETWORK_FILESYSTEMS
          scripts/config --disable NFS_FS
          scripts/config --disable NFSD
          scripts/config --disable CIFS
          # Debug - Disabled
          scripts/config --disable DEBUG_INFO
          
          # Hardware we don't use
          scripts/config --disable MEDIA_SUPPORT
          scripts/config --disable WLAN
          scripts/config --disable MAC80211
          scripts/config --disable CFG80211
          scripts/config --disable BLK_DEV_FD
          scripts/config --disable PARPORT
          scripts/config --disable ATA_SFF
          scripts/config --disable PCCARD
          
          # Rare Network Protocols we don't use
          scripts/config --disable ATM
          scripts/config --disable APPLETALK
          scripts/config --disable AX25
          scripts/config --disable ISDN
          scripts/config --disable HAMRADIO
          scripts/config --disable IRDA
          
          # Hyper-optimization: Optical drives
          scripts/config --disable BLK_DEV_SR
          scripts/config --disable CDROM
          
          # Hyper-optimization: HyperV Guest drivers (we are bare metal)
          scripts/config --disable HYPERV
          scripts/config --disable HYPERV_STORAGE
          scripts/config --disable HYPERV_NET
          scripts/config --disable HYPERV_KEYBOARD
          
          # Hyper-optimization: Legacy Audio
          scripts/config --disable SND_ISA
          scripts/config --disable SND_FIREWIRE
          scripts/config --disable SND_PCMCIA
          
          # Hyper-optimization: Archaic Filesystems
          scripts/config --disable MINIX_FS
          scripts/config --disable HFS_FS
          scripts/config --disable HFSPLUS_FS
          scripts/config --disable UFS_FS
          
          # Hyper-optimization: Obsolete Joysticks
          scripts/config --disable JOYSTICK_IFORCE
          scripts/config --disable JOYSTICK_PSXPAD
          
          # Paranoia Level: Prehistoric buses and ports
          scripts/config --disable AGP
          scripts/config --disable EISA
          scripts/config --disable MCA
          scripts/config --disable MOUSE_SERIAL
          scripts/config --disable MOUSE_APPLETOUCH
          scripts/config --disable MAC_EMUMOUSEBTN
          
          # Paranoia Level: Fossil Networks
          scripts/config --disable TR
          scripts/config --disable FDDI
          scripts/config --disable WIMAX
          scripts/config --disable NET_VENDOR_3COM
          scripts/config --disable NET_VENDOR_SMC
          scripts/config --disable NET_VENDOR_SIS
          
          # Paranoia Level: Museum Framebuffers
          scripts/config --disable FB_3DFX
          scripts/config --disable FB_RIVA
          scripts/config --disable FB_MATROX
          scripts/config --disable FB_VOODOO1
          
          # Paranoia Level: Xen Virtualization
          scripts/config --disable XEN
          
          # Paranoia Level: Non-AMD Sensors
          scripts/config --disable SENSORS_CORETEMP
          scripts/config --disable SENSORS_VIA686A
          
          # Extreme Level: Alien Laptops & Brands
          scripts/config --disable CHROME_PLATFORMS
          scripts/config --disable SURFACE_PLATFORMS
          scripts/config --disable MACINTOSH_DRIVERS
          scripts/config --disable APPLE_PROPERTIES
          
          # Extreme Level: Non-Wacom Tablets
          scripts/config --disable HID_HUION
          scripts/config --disable HID_XPEN
          scripts/config --disable HID_UGEE
          scripts/config --disable HID_KYE
          scripts/config --disable HID_WALTOP
          
          # Extreme Level: Servers & Datacenters
          scripts/config --disable INFINIBAND
          scripts/config --disable WATCHDOG
          scripts/config --disable CRYPTO_DEV_QAT
          scripts/config --disable CRYPTO_DEV_NITROX
          
          # Extreme Level: Exotic Partitions
          scripts/config --disable AMIGA_PARTITION
          scripts/config --disable MAC_PARTITION
          scripts/config --disable SUN_PARTITION
          scripts/config --disable BSD_DISKLABEL
          scripts/config --disable SGI_PARTITION
          
          # Extreme Level: Android, NFC, IIO, Microcode, Speakup
          scripts/config --disable ANDROID
          scripts/config --disable ASHMEM
          scripts/config --disable NFC
          scripts/config --disable IIO
          scripts/config --disable MICROCODE_INTEL
          scripts/config --disable SPEAKUP
          scripts/config --disable INPUT_PCSPKR
          
          # Atomic Level: FireWire, SD cards, CAN, Dial-up, MTD, Exotic Net FS
          scripts/config --disable FIREWIRE
          scripts/config --disable MMC
          scripts/config --disable CAN
          scripts/config --disable PHONE
          scripts/config --disable BLK_DEV_NBD
          scripts/config --disable BLK_DEV_DRBD
          scripts/config --disable CEPH_FS
          scripts/config --disable AFS_FS
          scripts/config --disable NET_9P
          scripts/config --disable 9P_FS
          scripts/config --disable CODA_FS
          scripts/config --disable MTD
          
          # Black Hole Level: Livepatch, Kexec, Gameport, PTP, Staging
          scripts/config --disable LIVEPATCH
          scripts/config --disable KEXEC
          scripts/config --disable KEXEC_FILE
          scripts/config --disable GAMEPORT
          scripts/config --disable PTP_1588_CLOCK
          scripts/config --disable HW_RANDOM_INTEL
          scripts/config --disable HW_RANDOM_VIA
          scripts/config --disable STAGING
          scripts/config --disable DRM_VMWGFX
          
          # EXCEPTIONS: Kept as modules for safety / specific hardware
          scripts/config --module USB_SERIAL
          scripts/config --module USB_SERIAL_FTDI_SIO
          scripts/config --module USB_SERIAL_PL2303
          scripts/config --module USB_EHCI_HCD
          scripts/config --module USB_OHCI_HCD
          scripts/config --module USB_UHCI_HCD
          scripts/config --module DRM_QXL
          
          scripts/config --disable DEBUG_INFO_BTF
          scripts/config --disable DEBUG_INFO_DWARF_TOOLCHAIN_DEFAULT
          scripts/config --disable DEBUG_INFO_DWARF4
          scripts/config --disable DEBUG_INFO_DWARF5
          # Disable certificates (prevents build failure since we don't have Debian's private certs)
          scripts/config --set-str SYSTEM_TRUSTED_KEYS ""
          scripts/config --set-str SYSTEM_REVOCATION_KEYS ""
          
          # Finalize config
          make olddefconfig
          
          # Copy back to workspace
          cp .config "$GITHUB_WORKSPACE/kernel-config/.config"

      - name: Commit and push generated .config
        run: |
          cd "$GITHUB_WORKSPACE"
          if [ ! -d .git ]; then
            echo "Reconstructing git repository..."
            git init
            git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
            git fetch
            git reset --soft origin/main
            git branch -M main
          fi
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kernel-config/.config
          
          COMMIT_MSG="config: generate generic crystal config"
          if [ "${{ github.event.inputs.trigger_build }}" = "false" ]; then
            COMMIT_MSG="$COMMIT_MSG [skip ci]"
          fi
          
          git diff --cached --quiet && echo "No changes generated" || \
            (git commit -m "$COMMIT_MSG" && git push)
