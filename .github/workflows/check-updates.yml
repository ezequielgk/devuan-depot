name: "Maintenance: Check Upstream Updates"

on:
  workflow_dispatch:
  schedule:
    # Runs every Monday and Thursday at 08:00 UTC
    - cron: '0 8 * * 1,4'

jobs:
  check-updates:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check for updates
        id: check
        run: python3 .github/scripts/check_updates.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Issue
        if: steps.check.outputs.HAS_UPDATES == 'true'
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: "Updates Available to Compile 📦"
          content-filepath: ./updates.md
          labels: "update"
