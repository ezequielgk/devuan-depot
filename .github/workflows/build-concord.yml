name: Build Concord .deb
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    steps:
      # Composite action lives in the default branch; sparse-checkout only.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            gcc build-essential pkg-config cmake git dpkg-dev ca-certificates curl jq \
            libopus-dev libasound2-dev libssl-dev

      - name: Install latest Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Clone Concord
        run: |
          LATEST_TAG=$(curl -sL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/chojs23/concord/tags | jq -r '.[0].name')
          echo "Obtained latest version: $LATEST_TAG"
          echo "CONCORD_VERSION=$LATEST_TAG" >> $GITHUB_ENV

          git clone --branch $LATEST_TAG --depth 1 https://github.com/chojs23/concord.git src

      - name: Compile
        working-directory: src
        run: |
          cargo build --release

      - name: Stage pkgroot
        working-directory: src
        run: |
          # Strip a leading 'v' from the tag (e.g. v0.1.0 -> 0.1.0) and append
          # github.run_number so every re-run ships a strictly higher .deb
          # version, preventing a stale pool entry from winning apt upgrades.
          VERSION="${CONCORD_VERSION#v}-${{ github.run_number }}~devuandepot"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

          mkdir -p pkgroot/DEBIAN pkgroot/usr/bin
          cp target/release/concord pkgroot/usr/bin/

      - name: Resolve shlib dependencies
        id: deps
        uses: ./.github/actions/dpkg-shlibdeps-deps
        with:
          package-name: concord
          section: x11
          priority: optional
          maintainer: 'Zeke Ezequielgk <ezequieldtz@tuta.io>'
          find-expr: 'pkgroot/usr/bin -type f -executable'
          description-stub: 'concord stub'

      - name: Write control file and build .deb
        working-directory: src
        env:
          DEPS: ${{ steps.deps.outputs.depends }}
        run: |
          cat > pkgroot/DEBIAN/control <<CTRL
          Package: concord
          Version: ${VERSION}
          Section: x11
          Priority: optional
          Architecture: amd64
          Depends: ${DEPS}
          Maintainer: Zeke Ezequielgk <ezequieldtz@tuta.io>
          Description: Concord - A Discord terminal client
           Concord is a fast and simple terminal Discord client written in Rust.
          CTRL

          dpkg-deb --build --root-owner-group pkgroot "concord_${VERSION}_amd64.deb"
          mv "concord_${VERSION}_amd64.deb" ..

      - uses: actions/upload-artifact@v4
        with:
          name: concord-deb
          path: concord_*_amd64.deb

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages

      - uses: actions/download-artifact@v4
        with:
          name: concord-deb
          path: incoming

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Add to pool and regenerate indices
        run: |
          sudo apt-get install -y dpkg-dev
          mkdir -p pool/main dists/trixie/main/binary-amd64
          cp incoming/*.deb pool/main/
          dpkg-scanpackages --arch amd64 pool/ > dists/trixie/main/binary-amd64/Packages
          gzip -9fk dists/trixie/main/binary-amd64/Packages

      - name: Generate and sign Release
        run: |
          cd dists/trixie
          cat > Release <<REL
          Origin: devuan-depot
          Label: devuan-depot Personal Repo
          Suite: trixie
          Codename: trixie
          Architectures: amd64
          Components: main
          Date: $(date -Ru)
          REL
          apt-ftparchive release . >> Release
          gpg --batch --yes \
            --default-key "${{ secrets.GPG_KEY_ID }}" -abs -o Release.gpg Release
          gpg --batch --yes \
            --default-key "${{ secrets.GPG_KEY_ID }}" --clearsign -o InRelease Release

      - name: Commit and push to gh-pages
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add pool dists
          git commit -m "Add/Update concord" || echo "No changes"
          git push