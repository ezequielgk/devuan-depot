name: Build Custom Kernel (Devuan/Debian trixie)

on:
  workflow_dispatch:
    inputs:
      kernel_source_version:
        description: 'Exact version of the "linux" source package in trixie (empty = latest available in the repo)'
        required: false
        default: ''
      localversion:
        description: 'LOCALVERSION suffix'
        required: false
        default: '-custom'
  push:
    paths:
      - 'kernel-config/.config'
      - '.github/workflows/build-kernel-devuan.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Enable deb-src and update
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates
          # The debian:trixie container brings sources in deb822 format (Types: deb).
          # We add deb-src to be able to download the kernel source package.
          if [ -f /etc/apt/sources.list.d/debian.sources ]; then
            sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/debian.sources
          else
            echo "deb-src http://deb.debian.org/debian trixie main" >> /etc/apt/sources.list
          fi
          apt-get update

      - name: Install build dependencies
        run: |
          apt-get install -y --no-install-recommends \
            build-essential libncurses-dev bison flex libssl-dev libelf-dev \
            fakeroot dpkg-dev debhelper bc rsync kmod cpio wget xz-utils \
            dpkg-source python3 dwarves

      - name: Download the "linux" source package (the same one Devuan packages)
        run: |
          mkdir -p /build && cd /build
          if [ -n "${{ github.event.inputs.kernel_source_version }}" ]; then
            apt-get source linux=${{ github.event.inputs.kernel_source_version }}
          else
            apt-get source linux
          fi
          # Extracted to /build/linux-<version>/
          ls -d linux-*/ | head -1 > /build/srcdir.txt
          cat /build/srcdir.txt

      - name: Copy the committed .config (generated with menuconfig on your Devuan)
        run: |
          SRCDIR=$(cat /build/srcdir.txt)
          if [ ! -f "kernel-config/.config" ]; then
            echo "kernel-config/.config is missing in the repo. Generate it on your machine with"
            echo "localmodconfig + menuconfig and commit it before running this."
            exit 1
          fi
          cp kernel-config/.config "/build/${SRCDIR}.config"

      - name: Adapt config to this exact source version
        run: |
          SRCDIR=$(cat /build/srcdir.txt)
          cd "/build/${SRCDIR}"
          make olddefconfig

      - name: ccache Cache
        uses: actions/cache@v4
        with:
          path: /root/.ccache
          key: ccache-devuan-${{ hashFiles('kernel-config/.config') }}
          restore-keys: |
            ccache-devuan-

      - name: Install ccache
        run: apt-get install -y --no-install-recommends ccache

      - name: Compile (.deb with intact Debian/Devuan hooks)
        run: |
          SRCDIR=$(cat /build/srcdir.txt)
          cd "/build/${SRCDIR}"
          export PATH="/usr/lib/ccache:$PATH"
          make -j$(nproc) deb-pkg LOCALVERSION=${{ github.event.inputs.localversion || '-custom' }}

      - name: Gather generated .deb files
        run: |
          mkdir -p dist
          mv /build/linux-image-*.deb dist/ 2>/dev/null || true
          mv /build/linux-headers-*.deb dist/ 2>/dev/null || true
          mv /build/linux-libc-dev*.deb dist/ 2>/dev/null || true
          ls -lh dist/

      - name: Checksums
        working-directory: dist
        run: sha256sum *.deb > SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-devuan${{ github.event.inputs.localversion || '-custom' }}
          path: dist/
          retention-days: 30

      - name: Create release (only push to main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kernel-devuan${{ github.event.inputs.localversion || '-custom' }}-${{ github.run_number }}
          name: Custom Devuan Kernel (build ${{ github.run_number }})
          files: dist/*
          body: |
            Compiled from the `linux` source package of trixie/deb13 (the same
            one Devuan repackages), with the `.config` from `kernel-config/.config`
            (commit ${{ github.sha }}).

            Installation on your Devuan:
            ```
            sudo dpkg -i linux-image-*.deb linux-headers-*.deb
            ```
            The Debian/Devuan postinst hooks should regenerate initramfs
            and grub automatically. If not:
            ```
            sudo update-initramfs -c -k <version>
            sudo update-grub
            ```
