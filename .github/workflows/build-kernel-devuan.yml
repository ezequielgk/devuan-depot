name: Build Custom Kernel - AMD (Devuan/Debian trixie)

on:
  workflow_dispatch:
    inputs:
      kernel_source_version:
        description: 'Exact version of the "linux" source package in trixie (empty = latest available)'
        required: false
        default: ''
      localversion:
        description: 'LOCALVERSION suffix'
        required: false
        default: '-amd'
  push:
    paths:
      - 'kernel-config/.config'
      - '.github/workflows/build-kernel-devuan.yml'
  schedule:
    # Runs every day at 06:00 UTC. If there is no new version in the
    # Debian repo, the build job skips itself (see "check" job).
    - cron: '0 6 * * *'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    outputs:
      version: ${{ steps.decide.outputs.version }}
      should_build: ${{ steps.decide.outputs.should_build }}
    steps:
      - name: Install git for checkout
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Check latest available version in trixie
        id: latest
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends apt-utils > /dev/null
          LATEST=$(apt-cache madison linux | head -1 | awk '{print $3}')
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "Latest version in trixie: $LATEST"

      - name: Decide whether to compile
        id: decide
        run: |
          LAST_BUILT="none"
          if [ -f kernel-config/last-built-version.txt ]; then
            LAST_BUILT=$(cat kernel-config/last-built-version.txt)
          fi
          echo "Last compiled: $LAST_BUILT"
          echo "Available now: ${{ steps.latest.outputs.latest }}"

          if [ -n "${{ github.event.inputs.kernel_source_version }}" ]; then
            VERSION="${{ github.event.inputs.kernel_source_version }}"
            SHOULD_BUILD=true
          elif [ "${{ github.event_name }}" != "schedule" ]; then
            VERSION="${{ steps.latest.outputs.latest }}"
            SHOULD_BUILD=true
          elif [ "${{ steps.latest.outputs.latest }}" != "$LAST_BUILT" ]; then
            VERSION="${{ steps.latest.outputs.latest }}"
            SHOULD_BUILD=true
          else
            VERSION="${{ steps.latest.outputs.latest }}"
            SHOULD_BUILD=false
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "should_build=$SHOULD_BUILD" >> "$GITHUB_OUTPUT"
          echo "Should compile?: $SHOULD_BUILD (version: $VERSION)"

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    steps:
      - name: Install git for checkout
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: ccache Cache
        uses: actions/cache@v4
        with:
          path: /root/.ccache
          key: ccache-amd-${{ hashFiles('kernel-config/.config') }}
          restore-keys: |
            ccache-amd-

      - name: Install dependencies from JSON and run build script
        env:
          KERNEL_SOURCE_VERSION: ${{ needs.check.outputs.version }}
          LOCALVERSION: ${{ github.event.inputs.localversion || '-amd' }}
        run: |
          apt-get update
          apt-get install -y jq curl wget ca-certificates
          
          # Parse dependencies from JSON
          META_FILE="scripts/meta/kernel-amd.json"
          BASE_PKGS=$(jq -r '.base_apt_packages | join(" ")' "$META_FILE")
          apt-get install -y --no-install-recommends $BASE_PKGS
          
          # Run the build script
          bash scripts/build-kernel-amd.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: amd-${{ needs.check.outputs.version }}
          path: dist/
          retention-days: 30

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: amd-${{ needs.check.outputs.version }}-${{ github.run_number }}
          name: AMD ${{ needs.check.outputs.version }} (build ${{ github.run_number }})
          files: dist/*
          body: |
            Custom Devuan kernel "amd", compiled from the `linux` source package
            version `${{ needs.check.outputs.version }}` of trixie/deb13,
            with the `.config` from `kernel-config/.config` (commit ${{ github.sha }}).

            Installation on your Devuan:
            ```
            sudo dpkg -i linux-image-*.deb linux-headers-*.deb
            ```
            The Debian/Devuan postinst hooks should regenerate initramfs
            and grub automatically. If not:
            ```
            sudo update-initramfs -c -k <version>-amd
            sudo update-grub
            ```

      - name: Register compiled version (for future automatic checking)
        run: |
          cd "$GITHUB_WORKSPACE"
          if [ ! -d .git ]; then
            echo "Reconstructing git repository..."
            git init
            git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
            git fetch
            git reset --soft origin/main
            git branch -M main
          fi
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "${{ needs.check.outputs.version }}" > kernel-config/last-built-version.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kernel-config/last-built-version.txt
          git diff --cached --quiet && echo "No changes to commit" || \
            (git commit -m "chore: amd ${{ needs.check.outputs.version }} compiled [skip ci]" && git push)

  publish:
    needs: [check, build]
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: incoming/
          pattern: amd-${{ needs.check.outputs.version }}
          merge-multiple: true

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Move to pool and scan (Keeping only the latest kernel)
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          mkdir -p pool/main
          # Delete any previous kernel packages to avoid bloating the gh-pages repository
          rm -f pool/main/linux-image-*.deb pool/main/linux-headers-*.deb pool/main/linux-libc-dev*.deb
          
          # Copy the new kernel packages
          cp incoming/*.deb pool/main/
          
          dpkg-scanpackages --arch amd64 --multiversion pool/ > dists/trixie/main/binary-amd64/Packages
          gzip -9fk dists/trixie/main/binary-amd64/Packages
          
          cd dists/trixie
          rm -f Release Release.gpg InRelease
          cat > Release <<REL
          Origin: devuan-depot
          Label: devuan-depot Personal Repo
          Suite: trixie
          Codename: trixie
          Architectures: amd64
          Components: main
          Date: $(date -Ru)
          REL
          apt-ftparchive release . >> Release
          gpg --default-key "$GPG_KEY_ID" --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" -abs -o Release.gpg Release
          gpg --default-key "$GPG_KEY_ID" --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --clearsign -o InRelease Release

      - name: Commit and push to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pool/ dists/
          git commit -m "chore(repo): update kernel to amd ${{ needs.check.outputs.version }}" || echo "No changes to commit"
          git push
