name: Cleanup Legacy Versions

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev

      - name: Remove packages without ~devuandepot (if a new version exists)
        run: |
          set -eu
          DELETED=0
          cd pool/main
          
          # Find all unique package names (everything before the first underscore)
          for pkg_path in *.deb; do
            pkg_name=$(echo "$pkg_path" | cut -d_ -f1)
            # If this package has at least one ~devuandepot version
            if ls ${pkg_name}_*.deb 2>/dev/null | grep -q "~devuandepot"; then
              # Find and delete versions of this package that lack the suffix
              for deb in ${pkg_name}_*.deb; do
                if [[ "$deb" != *~devuandepot* ]]; then
                  echo "Found legacy version: $deb. Deleting..."
                  git rm -f "$deb"
                  DELETED=$((DELETED + 1))
                fi
              done
            fi
          done
          
          cd ../..
          if [ "$DELETED" -eq 0 ]; then
            echo "No legacy versions found to delete."
            echo "SHOULD_COMMIT=false" >> $GITHUB_ENV
            exit 0
          else
            echo "Deleted $DELETED legacy versions."
            echo "SHOULD_COMMIT=true" >> $GITHUB_ENV
          fi

          dpkg-scanpackages --arch amd64 --multiversion pool/ > dists/trixie/main/binary-amd64/Packages
          gzip -9fk dists/trixie/main/binary-amd64/Packages
          cd dists/trixie
          cat > Release <<EOF
          Origin: devuan-depot
          Label: devuan-depot Personal Repo
          Suite: trixie
          Codename: trixie
          Architectures: amd64
          Components: main
          Date: \$(date -Ru)
          EOF
          sed -i 's/^ *//' Release
          apt-ftparchive release . >> Release

      - name: Import GPG key
        if: env.SHOULD_COMMIT == 'true'
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Sign Release
        if: env.SHOULD_COMMIT == 'true'
        working-directory: ${{ github.workspace }}/dists/trixie
        run: |
          gpg --batch --yes \
            --default-key "${{ secrets.GPG_KEY_ID }}" -abs -o Release.gpg Release
          gpg --batch --yes \
            --default-key "${{ secrets.GPG_KEY_ID }}" --clearsign -o InRelease Release

      - name: Commit and push
        if: env.SHOULD_COMMIT == 'true'
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git commit -m "chore(pool): cleanup legacy versions without ~devuandepot suffix"
          git push
