name: Build Steam bundled .deb

on:
  workflow_dispatch:
  schedule:
    # una vez por semana, para agarrar actualizaciones de steam en el repo de Arch
    - cron: '0 4 * * 1'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar dependencias del host
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse libfuse2 dpkg-dev wget curl zsync git

      - name: Permitir user namespaces sin privilegios (requerido por RunImage)
        run: |
          # Ubuntu 23.10+ restringe esto por AppArmor; RunImage lo necesita para
          # correr el contenedor Arch sin root real.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Dar permisos de ejecución a los scripts
        run: chmod +x .github/scripts/build-steam-bundle.sh .github/scripts/package-deb.sh

      - name: Armar el bundle de Steam (RunImage + pacman)
        run: ./.github/scripts/build-steam-bundle.sh

      - name: Empaquetar como .deb
        run: ./.github/scripts/package-deb.sh

      - name: Subir .deb como artifact
        uses: actions/upload-artifact@v4
        with:
          name: steam-bundled-deb
          path: ./*.deb

      - name: Leer versión para el release
        id: version
        run: echo "version=$(cat ~/version)" >> "$GITHUB_OUTPUT"

      - name: Crear/actualizar release con el .deb
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Steam ${{ steps.version.outputs.version }} (bundled .deb)
          files: ./*.deb
          fail_on_unmatched_files: true

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: steam-bundled-deb
          path: .

      - name: Extract version
        id: version
        run: |
          DEB=$(ls *.deb | head -n 1)
          VERSION=$(dpkg-deb -f "$DEB" Version)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          
          # Git tags no pueden contener el carácter '~', así que lo reemplazamos por '-'
          TAG_VERSION=$(echo "$VERSION" | tr '~' '-')
          echo "tag=$TAG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.tag }}
          name: Steam Bundled ${{ steps.version.outputs.version }}
          files: ./*.deb
          fail_on_unmatched_files: true
